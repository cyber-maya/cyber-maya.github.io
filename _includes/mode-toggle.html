<!-- Switch the mode between dark and light. -->

<script type="text/javascript">
  class ModeToggle {
    static get MODE_KEY() {
      return 'mode';
    }
    static get MODE_ATTR() {
      return 'data-mode';
    }
    static get DARK_MODE() {
      return 'dark';
    }
    static get LIGHT_MODE() {
      return 'light';
    }
    static get ID() {
      return 'mode-toggle';
    }

    constructor() {
      let self = this;

      // Initialize the mode on page load
      if (this.hasMode) {
        // If user has a saved preference, use it
        if (this.isDarkMode) {
          this.setDark();
        } else {
          this.setLight();
        }
      } else {
        // If no saved preference, follow system preference
        if (this.isPreferDark) {
          document.documentElement.setAttribute(ModeToggle.MODE_ATTR, ModeToggle.DARK_MODE);
        } else {
          document.documentElement.setAttribute(ModeToggle.MODE_ATTR, ModeToggle.LIGHT_MODE);
        }
      }

      {%- comment -%} always follow the system prefers {%- endcomment -%}
      this.sysDarkPrefers.addEventListener('change', () => {
        if (self.hasMode) {
          self.clearMode();
        }
        // Update DOM to reflect system preference
        if (self.isPreferDark) {
          document.documentElement.setAttribute(ModeToggle.MODE_ATTR, ModeToggle.DARK_MODE);
        } else {
          document.documentElement.setAttribute(ModeToggle.MODE_ATTR, ModeToggle.LIGHT_MODE);
        }
        self.notify();
      });
    }

    get sysDarkPrefers() {
      return window.matchMedia('(prefers-color-scheme: dark)');
    }

    get isPreferDark() {
      return this.sysDarkPrefers.matches;
    }

    get isDarkMode() {
      return this.mode === ModeToggle.DARK_MODE;
    }

    get hasMode() {
      return this.mode != null;
    }

    get mode() {
      return sessionStorage.getItem(ModeToggle.MODE_KEY);
    }

    {%- comment -%} get the current mode on screen {%- endcomment -%}
    get modeStatus() {
      if (this.hasMode) {
        return this.mode;
      } else {
        return this.isPreferDark ? ModeToggle.DARK_MODE : ModeToggle.LIGHT_MODE;
      }
    }

    setDark() {
      document.documentElement.setAttribute(ModeToggle.MODE_ATTR, ModeToggle.DARK_MODE);
      sessionStorage.setItem(ModeToggle.MODE_KEY, ModeToggle.DARK_MODE);
    }

    setLight() {
      document.documentElement.setAttribute(ModeToggle.MODE_ATTR, ModeToggle.LIGHT_MODE);
      sessionStorage.setItem(ModeToggle.MODE_KEY, ModeToggle.LIGHT_MODE);
    }

    clearMode() {
      document.documentElement.removeAttribute(ModeToggle.MODE_ATTR);
      sessionStorage.removeItem(ModeToggle.MODE_KEY);
    }

    {%- comment -%}
      Notify another plugins that the theme mode has changed
    {%- endcomment -%}
    notify() {
      window.postMessage(
        {
          direction: ModeToggle.ID,
          message: this.modeStatus
        },
        '*'
      );
    }

    flipMode() {
      // Get current effective mode (saved preference or system preference)
      const currentMode = this.modeStatus;
      
      // Toggle to the opposite mode
      if (currentMode === ModeToggle.DARK_MODE) {
        this.setLight();
      } else {
        this.setDark();
      }

      this.notify();
    }
  }

  // Create modeToggle instance
  const modeToggle = new ModeToggle();
  
  // Make modeToggle globally accessible for debugging
  window.modeToggle = modeToggle;
  
  // Attach click event to the mode toggle button
  function attachToggleHandler() {
    const toggleButton = document.getElementById(ModeToggle.ID);
    if (toggleButton) {
      // Remove any existing listeners by cloning the button
      if (toggleButton.hasAttribute('data-listener-attached')) {
        return; // Already attached
      }
      
      toggleButton.setAttribute('data-listener-attached', 'true');
      
      toggleButton.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        modeToggle.flipMode();
      });
    }
  }
  
  // Multiple strategies to ensure the button is found
  // Strategy 1: DOMContentLoaded
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attachToggleHandler);
  } else {
    // DOM is already loaded
    attachToggleHandler();
  }
  
  // Strategy 2: Window load (everything including images)
  window.addEventListener('load', attachToggleHandler);
  
  // Strategy 3: Multiple timeouts as fallback
  setTimeout(attachToggleHandler, 50);
  setTimeout(attachToggleHandler, 200);
  setTimeout(attachToggleHandler, 500);
</script>
